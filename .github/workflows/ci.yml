name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (tests + VSS helper compile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test --workspace

      # The explicit purpose of this job: prove the VSS requester helper
      # compiles against the real Windows SDK vsbackup.h (the Rust
      # `windows` crate does not expose IVssBackupComponents).
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Compile VSS helper (vss_helper.cpp)
        shell: cmd
        run: cl /nologo /LD /EHsc crates\safereturn-vss\cpp\vss_helper.cpp /link VssApi.lib Ole32.lib /OUT:vss_helper.dll

  linux:
    name: Linux (fmt + tests + windows-target check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust (stable, windows target)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Format check
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Windows-target check
        run: cargo check --workspace --target x86_64-pc-windows-msvc
